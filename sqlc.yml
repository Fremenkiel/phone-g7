version: "2"

sql:
  # Event Domain
  - engine: "sqlite"
    schema: "db/migrations/"
    queries: "internal/event/queries.sql"
    gen:
      go:
        package: "event"
        out: "internal/event"
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
        emit_json_tags: true
        output_querier_file_name: "repository.go"
